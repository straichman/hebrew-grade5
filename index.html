<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחברת העברית שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fff4e6; --bg2:#ffe3ec; --card:#ffffff; --ink:#2d2a3e; --muted:#7a7590; --line:#ece6f2;
  --c1:#ff7a59; --c2:#7c5cff; --c3:#18b6a4; --c4:#ffb400; --c5:#ff5c8a; --c6:#3a9bff;
  --ok:#22b07d; --ok-soft:#dcf7ea; --bad:#ef5a4c; --bad-soft:#ffe5e2; --hl:#ffe27a;
  --accent:var(--c2);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#1d1a2b; --bg2:#271d33; --card:#2b2740; --ink:#f3f0ff; --muted:#b2aac9; --line:#3d3758;
    --ok-soft:#1c3d31; --bad-soft:#47262a; --hl:#8a6d10;
  }
}
:root[data-theme="dark"]{
  --bg1:#1d1a2b; --bg2:#271d33; --card:#2b2740; --ink:#f3f0ff; --muted:#b2aac9; --line:#3d3758;
  --ok-soft:#1c3d31; --bad-soft:#47262a; --hl:#8a6d10;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--ink);
  font-family:"Rubik","Varela Round",Arial,sans-serif;font-size:19px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3,.round{font-family:"Varela Round","Rubik",sans-serif}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.dots{display:flex;gap:6px;flex:1;justify-content:center}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:18px;background:var(--card);
  border:3px solid var(--line);transition:.25s;cursor:pointer}
.dot.cur{transform:scale(1.15);border-color:var(--accent)}
.dot.done{background:var(--ok-soft);border-color:var(--ok)}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c4),var(--c5),var(--c2));transition:width .5s}

.screen{display:none;animation:pop .35s ease}
.screen.on{display:block}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.hero{border-radius:26px;padding:26px 22px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px;
  box-shadow:0 10px 30px rgba(80,40,120,.18)}
.hero h2{margin:0;font-size:30px}
.hero p{margin:6px 0 0;opacity:.95}
.hero .big{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:70px;opacity:.9}
.hero::after{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.15);left:-50px;bottom:-90px}

.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;border:2px solid var(--line);transition:.2s}
.card.ok{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--card) 60%)}
.card.bad{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(3px)}}
.qt{font-weight:500;margin-bottom:10px}
.qn{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:10px;background:var(--accent);color:#fff;font-size:16px;margin-inline-end:8px;padding:0 6px}
.fb{margin-top:8px;font-weight:700;font-size:17px;min-height:0}
.card.ok .fb{color:var(--ok)} .card.bad .fb{color:var(--bad)}

.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{font:inherit;font-size:18px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;transition:.15s}
.opt:active{transform:scale(.96)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));font-weight:500}
.card.ok .opt.sel{border-color:var(--ok);background:var(--ok-soft)}
.card.bad .opt.sel{border-color:var(--bad);background:var(--bad-soft)}
.opt.reveal{box-shadow:0 0 0 3px var(--ok)}

.boxes{display:flex;gap:6px;direction:rtl;flex-wrap:wrap}
.boxes input{width:48px;height:54px;text-align:center;font:inherit;font-size:26px;font-weight:800;border:3px solid var(--line);
  border-radius:12px;background:var(--card);color:var(--ink);padding:0}
.boxes input.h{background:var(--hl);border-color:#e7b800;color:#3b2c00}
.boxes input:focus{outline:none;border-color:var(--accent)}
.hidden-word .boxes input{background:var(--hl);border-color:#e7b800;color:#3b2c00}
.cwhint{font-size:15px;color:var(--muted);margin-inline-start:6px}

input.txt,select,textarea{font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input.txt:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.verb{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.verb .w{font-family:"Varela Round";font-size:30px;color:var(--accent);min-width:110px}
.verb label{display:flex;flex-direction:column;font-size:14px;color:var(--muted);gap:3px}
.verb input.txt{width:120px}

.passage{background:var(--card);border-radius:20px;padding:20px;margin-bottom:16px;border:2px dashed var(--c4);font-size:19px}
.passage h3{margin:0 0 10px;text-align:center;font-size:24px}
.passage p{margin:0 0 10px}
textarea{width:100%;min-height:110px}

.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:18px;flex-wrap:wrap}
.btn{font-family:"Varela Round",sans-serif;font-size:20px;padding:14px 26px;border-radius:18px;border:0;cursor:pointer;color:#fff;
  background:var(--accent);box-shadow:0 6px 0 color-mix(in srgb,var(--accent) 65%,#000);transition:.1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 color-mix(in srgb,var(--accent) 65%,#000)}
.btn.ghost{background:var(--card);color:var(--accent);border:2px solid var(--accent);box-shadow:none}
.btn.go{background:var(--ok);box-shadow:0 6px 0 #178a60}
.btn[disabled]{opacity:.45}
.score{font-weight:800;font-size:20px}

/* welcome */
.welcome{text-align:center;padding:10px 0}
.welcome .emoji{font-size:84px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px) rotate(-4deg)}}
.welcome h1{font-size:38px;margin:6px 0}
.welcome p{color:var(--muted);margin:0 0 18px}
.welcome input{text-align:center;font-size:22px;width:min(320px,100%);margin-bottom:18px}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 22px}
.chip{border-radius:16px;padding:12px 6px;color:#fff;font-size:16px;font-weight:500}
.chip b{display:block;font-size:28px}

/* summary */
.ring{width:190px;height:190px;margin:10px auto;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:"Varela Round";font-size:46px;font-weight:800}
.stars{font-size:44px;text-align:center;letter-spacing:6px}
table.sum{width:100%;border-collapse:collapse;margin:10px 0}
table.sum td{padding:10px 8px;border-bottom:1px solid var(--line)}
table.sum td:last-child{text-align:left;font-weight:700}
.sent{text-align:center;font-weight:500;margin-top:12px;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9}

@media (max-width:560px){
  .hero .big{font-size:50px} .hero h2{font-size:24px}
  .boxes input{width:42px;height:48px;font-size:22px}
  .dot{width:32px;height:32px;font-size:15px}
  .chips{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="wrap">
  <div id="topbar" style="display:none">
    <div class="top"><div class="dots" id="dots"></div></div>
    <div class="bar"><i id="barfill"></i></div>
  </div>
  <div id="screens"></div>
</div>

<script>
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLScaNritPioSCvNi18cw7ThOWGamk657dy66i6u5WLPqMlm8VA/formResponse";
const NAME_ENTRY = 62205601;

const CH = [
 {id:"cw", title:"תשבץ מילה נסתרת", emoji:"🧩", color:"var(--c1)", hint:"כתבי את התשובה, אות בכל משבצת. מהאותיות הצהובות נוצרת מילה נסתרת!",
  items:[
   {t:"cw", q:"עונת השנה הקרה ביותר", a:"חורף", h:0, e:1569600264},
   {t:"cw", q:"המקום שבו גרים עם המשפחה", a:"בית", h:0, e:498481048},
   {t:"cw", q:"יש לו כריכה ועמודים, וקוראים בו", a:"ספר", h:2, e:1436032802},
   {t:"cw", q:"צבע השמיים ביום בהיר", a:"כחול", h:2, e:1310203208},
   {t:"cw", q:"פרי אדום וקטן עם נקודות קטנות", a:"תות", h:0, e:294434809},
   {t:"hw", q:"🔎 המילה הנסתרת (האותיות הצהובות, מלמעלה למטה)", a:"חברות", e:260641742}
  ]},
 {id:"voc", title:"אוצר מילים", emoji:"📖", color:"var(--c2)", hint:"בחרי את התשובה המתאימה ביותר.",
  items:[
   {t:"mc", q:"\"דני היה נרגש לפני הטיול השנתי.\" מה פירוש המילה נרגש?", o:["עייף מאוד","מלא התרגשות וציפייה","כועס","רעב"], a:1, e:1328813776},
   {t:"mc", q:"מהי מילה נרדפת (דומה במשמעות) למילה \"מהיר\"?", o:["זריז","איטי","גבוה","שקט"], a:0, e:361980652},
   {t:"mc", q:"מהו ההפך של המילה \"נדיב\"?", o:["חכם","שמח","קמצן","אמיץ"], a:2, e:579132095},
   {t:"mc", q:"\"לפתע נשמע רעם חזק.\" המילה לפתע פירושה:", o:["לאט לאט","בבוקר","פתאום","מרחוק"], a:2, e:1823997680},
   {t:"mc", q:"אדם מתמיד הוא אדם ש...", o:["ממשיך להתאמץ ולא מוותר","מוותר מהר","תמיד מאחר","אוהב לישון"], a:0, e:1491651361},
   {t:"mc", q:"מה פירוש הביטוי \"שם לב\"?", o:["שם משהו על הלב","הבחין, הרגיש במשהו","נבהל","שכח"], a:1, e:1885488063}
  ]},
 {id:"verb", title:"ניתוח פעלים", emoji:"🔤", color:"var(--c3)", hint:"לכל פועל: כתבי את השורש (למשל כ.ת.ב), ובחרי זמן וגוף.",
  items:[
   {t:"verb", w:"כתבנו", r:"כתב", z:"עבר", go:["אני","אנחנו","הם","את"], g:"אנחנו", e:[1640364388,185473557,810355744]},
   {t:"verb", w:"ישחקו", r:"שחק", z:"עתיד", go:["הוא","אנחנו","הם","אתן"], g:"הם", e:[4867854,956632223,407131389]},
   {t:"verb", w:"רוקדת", r:"רקד", z:"הווה", go:["הוא","היא","אנחנו","הם"], g:"היא", e:[1128202655,1735079967,383598365]},
   {t:"verb", w:"תלמדי", r:"למד", z:"עתיד", go:["אני","את","הוא","אתם"], g:"את", e:[34009294,1172126072,1069534142]},
   {t:"verb", w:"שמרתם", r:"שמר", z:"עבר", go:["אתה","אנחנו","אתם","הן"], g:"אתם", e:[85139780,1751591890,1546072494]},
   {t:"verb", w:"אסגור", r:"סגר", z:"עתיד", go:["אני","אתה","הוא","אנחנו"], g:"אני", e:[934074268,364460935,1793156208]}
  ]},
 {id:"odd", title:"יוצא דופן", emoji:"🕵️‍♀️", color:"var(--c4)", hint:"בכל שורה יש מילה אחת שלא מתאימה לשאר. מצאי אותה!",
  items:[
   {t:"mc", q:"", o:["תפוח","בננה","גזר","אגס"], a:2, why:"גזר הוא ירק, השאר פירות.", e:339574986},
   {t:"mc", q:"", o:["כתב","קרא","שולחן","רץ"], a:2, why:"שולחן הוא שם עצם, השאר פעלים.", e:1603717156},
   {t:"mc", q:"", o:["שמח","עליז","מאושר","עצוב"], a:3, why:"עצוב הוא ההפך, השאר מילים לשמחה.", e:669759207},
   {t:"mc", q:"", o:["ירושלים","חיפה","ישראל","באר שבע"], a:2, why:"ישראל היא מדינה, השאר ערים.", e:2011101344},
   {t:"mc", q:"", o:["כלב","חתול","נשר","סוס"], a:2, why:"נשר הוא עוף, השאר יונקים.", e:904061253},
   {t:"mc", q:"", o:["הלכתי","אכלתי","אלך","שתיתי"], a:2, why:"אלך בזמן עתיד, השאר בעבר.", e:1752868074}
  ]},
 {id:"comp", title:"השלמת משפטים", emoji:"✏️", color:"var(--c5)", hint:"בחרי את המילה שמשלימה את המשפט נכון.",
  items:[
   {t:"mc", q:"דנה לא הגיעה לבית הספר ____ היא הייתה חולה.", o:["כי","אבל","למרות"], a:0, e:1012254732},
   {t:"mc", q:"רציתי לקנות גלידה, ____ שכחתי את הארנק בבית.", o:["לכן","אבל","כי"], a:1, e:916910106},
   {t:"mc", q:"הכלב נבח בקול רם, ____ כל השכנים התעוררו.", o:["ולכן","אבל","למרות ש"], a:0, e:1477193977},
   {t:"mc", q:"____ שירד גשם חזק, יצאנו לטיול.", o:["בגלל","למרות","כי"], a:1, e:1197070380},
   {t:"mc", q:"הספרנית ביקשה מאיתנו לדבר ____ בספרייה.", o:["ברעש","בשקט","בצעקות"], a:1, e:1626360728},
   {t:"mc", q:"אם תתאמני כל יום, ____ תשתפרי בשחייה.", o:["אז","אבל","למרות"], a:0, e:1691333618}
  ]},
 {id:"read", title:"הבנת הנקרא", emoji:"🐝", color:"var(--c6)", hint:"קראי את הקטע בעיון, ואז עני על השאלות.",
  passage:`<h3>🐝 הדבורה הקטנה והחרוצה</h3>
   <p>הדבורים חיות יחד בקבוצות גדולות שנקראות כוורות. בכל כוורת יש מלכה אחת, מאות זכרים ואלפי פועלות. המלכה היא הדבורה הגדולה ביותר בכוורת, ותפקידה העיקרי הוא להטיל ביצים. הפועלות עושות כמעט את כל העבודה: הן אוספות צוף ואבקה מהפרחים, בונות את חלות הדבש, מנקות את הכוורת ושומרות עליה מפני אויבים.</p>
   <p>כשפועלת מוצאת שדה מלא פרחים, היא חוזרת לכוורת ומבצעת "ריקוד" מיוחד. בעזרת הריקוד היא מספרת לחברותיה לאיזה כיוון לעוף וכמה רחוק נמצאים הפרחים.</p>
   <p>הדבורים חשובות מאוד, ולא רק בגלל הדבש. כשהן עוברות מפרח לפרח, הן מעבירות אבקה ביניהם, וכך עוזרות לצמחים לייצר פירות וזרעים. מדענים מעריכים שבלי דבורים, חלק גדול מהפירות והירקות שאנחנו אוכלים היה נעלם מהמדפים.</p>`,
  items:[
   {t:"mc", q:"מהו התפקיד העיקרי של המלכה בכוורת?", o:["לאסוף צוף","להטיל ביצים","לשמור על הכוורת","לבנות חלות דבש"], a:1, e:1494574270},
   {t:"mc", q:"מי עושות את רוב העבודה בכוורת?", o:["המלכה","הזכרים","הפועלות","הדבוראי"], a:2, e:1089239344},
   {t:"mc", q:"למה הפועלת \"רוקדת\" כשהיא חוזרת לכוורת?", o:["כי היא שמחה","כדי להפחיד אויבים","כדי לספר לחברותיה איפה נמצאים הפרחים","כדי לנקות את הכוורת"], a:2, e:451514463},
   {t:"mc", q:"בכותרת כתוב שהדבורה \"חרוצה\". מה פירוש המילה?", o:["עובדת קשה ובמרץ","קטנה מאוד","מפחידה","עצלנית"], a:0, e:278418444},
   {t:"open", q:"לפי הקטע, מדוע הדבורים חשובות לבני האדם? כתבי במילים שלך.", model:"הדבורים מעבירות אבקה מפרח לפרח, וכך עוזרות לצמחים לגדל פירות וזרעים. בלי דבורים היו לנו הרבה פחות פירות וירקות. וגם, הן מייצרות דבש.", e:1743199090}
  ]}
];

const Z=["עבר","הווה","עתיד"];
const norm=s=>(s||"").replace(/[\s.\-'"׳״,]/g,"").replace(/ך/g,"כ").replace(/ם/g,"מ").replace(/ן/g,"נ").replace(/ף/g,"פ").replace(/ץ/g,"צ");
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const PRAISE=["מעולה!","כל הכבוד!","יופי!","מדהים!","בדיוק!","אלופה!"];
let cur=-1; const res={}; let sentOnce=false;

function build(){
  const S=$("#screens");
  // welcome
  const w=h("section","screen welcome");w.id="sc-w";
  w.innerHTML=`<div class="emoji">📚</div><h1>מחברת העברית שלי</h1><p>שישה פרקים קצרים לקראת כיתה ה׳. בהצלחה!</p>
   <input class="txt" id="who" placeholder="איך קוראים לך?" autocomplete="off">
   <div class="chips">${CH.map(c=>`<div class="chip" style="background:${c.color}"><b>${c.emoji}</b>${c.title}</div>`).join("")}</div>
   <button class="btn" id="start">יוצאים לדרך ✨</button>`;
  S.appendChild(w);
  // chapters
  CH.forEach((c,ci)=>{
    const s=h("section","screen");s.id="sc-"+ci;s.style.setProperty("--accent",c.color);
    s.appendChild(h("div","hero",`<h2>פרק ${ci+1}: ${c.title}</h2><p>${c.hint}</p><div class="big">${c.emoji}</div>`)).style.background=`linear-gradient(135deg,${c.color},color-mix(in srgb,${c.color} 60%,#ff5c8a))`;
    if(c.passage) s.appendChild(h("div","passage",c.passage));
    c.items.forEach((it,i)=>{
      const card=h("div","card");card._it=it;
      const num=`<span class="qn">${i+1}</span>`;
      if(it.t==="cw"||it.t==="hw"){
        card.innerHTML=`<div class="qt">${it.t==="cw"?num:""}${it.q}${it.t==="cw"?`<span class="cwhint">(${it.a.length} אותיות)</span>`:""}</div>`;
        if(it.t==="hw") card.classList.add("hidden-word");
        const b=h("div","boxes");[...it.a].forEach((_,k)=>{const x=h("input",it.t==="cw"&&k===it.h?"h":"");x.maxLength=1;x.autocomplete="off";x.setAttribute("autocapitalize","off");b.appendChild(x)});
        card.appendChild(b);
      } else if(it.t==="mc"){
        card.innerHTML=`<div class="qt">${num}${it.q||"איזו מילה יוצאת דופן?"}</div>`;
        const o=h("div","opts");it.o.forEach((t,k)=>{const b=h("button","opt",t);b.type="button";b.dataset.k=k;
          b.onclick=()=>{$$(".opt",o).forEach(x=>x.classList.remove("sel"));b.classList.add("sel");card.classList.remove("ok","bad");$(".fb",card).textContent="";save()};o.appendChild(b)});
        card.appendChild(o);
      } else if(it.t==="verb"){
        card.innerHTML=`<div class="verb"><div class="w">${it.w}</div>
          <label>שורש<input class="txt r" placeholder="_._._" autocomplete="off"></label>
          <label>זמן<select class="z"><option value="">בחרי</option>${Z.map(z=>`<option>${z}</option>`).join("")}</select></label>
          <label>גוף<select class="g"><option value="">בחרי</option>${it.go.map(g=>`<option>${g}</option>`).join("")}</select></label></div>`;
      } else if(it.t==="open"){
        card.innerHTML=`<div class="qt">${num}${it.q}</div><textarea id="open" placeholder="התשובה שלי..."></textarea>`;
      }
      card.appendChild(h("div","fb"));
      s.appendChild(card);
    });
    const nav=h("div","nav");
    nav.innerHTML=`<button class="btn ghost back">→ חזרה</button><span class="score"></span>
      <span><button class="btn check">בדקי ✔</button> <button class="btn go next" style="display:none">${ci<CH.length-1?"לפרק הבא ←":"לסיכום 🏆"}</button></span>`;
    s.appendChild(nav);
    $(".check",nav).onclick=()=>check(ci,true);
    $(".next",nav).onclick=()=>go(ci+1);
    $(".back",nav).onclick=()=>go(ci-1);
    S.appendChild(s);
  });
  // summary
  const f=h("section","screen");f.id="sc-end";f.style.setProperty("--accent","var(--c2)");
  f.innerHTML=`<div class="hero" style="background:linear-gradient(135deg,#7c5cff,#ff5c8a);text-align:center"><h2 id="endTitle">סיימת!</h2><p id="endMsg"></p></div>
   <div class="card"><div class="ring"><svg width="190" height="190"><circle cx="95" cy="95" r="80" stroke="var(--line)" stroke-width="16" fill="none"/>
   <circle id="arc" cx="95" cy="95" r="80" stroke="url(#gr)" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="503" stroke-dashoffset="503" style="transition:stroke-dashoffset 1.2s"/>
   <defs><linearGradient id="gr"><stop offset="0" stop-color="#ffb400"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient></defs></svg><div class="num" id="pct">0%</div></div>
   <div class="stars" id="stars"></div><table class="sum" id="sumt"></table><div class="sent" id="sent"></div>
   <div class="nav" style="justify-content:center"><button class="btn ghost" id="again">לחזור ולתקן</button><button class="btn" id="resend" style="display:none">לשלוח שוב לאבא</button></div></div>`;
  S.appendChild(f);
  // dots
  const D=$("#dots");CH.forEach((c,i)=>{const d=h("div","dot",c.emoji);d.onclick=()=>go(i);D.appendChild(d)});
  const e=h("div","dot","🏆");e.onclick=()=>go(CH.length);D.appendChild(e);

  $("#start").onclick=()=>{ if(!$("#who").value.trim()){ $("#who").focus(); $("#who").placeholder="קודם כותבים שם 😊"; return;} save(); go(0); };
  $("#again").onclick=()=>go(0);
  $("#resend").onclick=()=>send(true);
  $$(".boxes").forEach(b=>$$("input",b).forEach((x,k,arr)=>{
    x.addEventListener("input",()=>{ if(x.value.length>1) x.value=x.value.slice(-1); if(x.value&&arr[k+1]) arr[k+1].focus(); x.closest(".card").classList.remove("ok","bad"); save(); });
    x.addEventListener("keydown",ev=>{ if(ev.key==="Backspace"&&!x.value&&arr[k-1]) arr[k-1].focus(); });
  }));
  $$("input.txt,select,textarea").forEach(x=>x.addEventListener("input",()=>{const c=x.closest(".card");if(c)c.classList.remove("ok","bad");save()}));
  $$("select").forEach(x=>x.addEventListener("change",()=>{const c=x.closest(".card");if(c)c.classList.remove("ok","bad");save()}));
}

function judge(card){
  const it=card._it;
  if(it.t==="cw"||it.t==="hw") return norm($$("input",card).map(x=>x.value).join(""))===norm(it.a);
  if(it.t==="mc"){const s=$(".opt.sel",card);return !!s&&+s.dataset.k===it.a}
  if(it.t==="verb") return norm($(".r",card).value)===norm(it.r)&&$(".z",card).value===it.z&&$(".g",card).value===it.g;
  return null;
}
function check(ci,show){
  const s=$("#sc-"+ci);let c=0,n=0;
  $$(".card",s).forEach(card=>{
    const it=card._it, r=judge(card), fb=$(".fb",card);
    if(r===null){ if(show){ fb.innerHTML=`<span style="color:var(--muted);font-weight:500">💡 תשובה לדוגמה: ${it.model}</span>`; } return; }
    n++; if(r)c++;
    if(show){ card.classList.toggle("ok",r);card.classList.toggle("bad",!r);
      fb.textContent = r ? "✓ "+PRAISE[Math.floor(Math.random()*PRAISE.length)]+(it.why?" "+it.why:"") : "✗ עוד לא, נסי שוב"; }
  });
  res[ci]={c,n};
  if(show){
    $(".score",s).textContent=`${c} / ${n}`+(c===n?" 🌟":"");
    $(".next",s).style.display="inline-block";
    if(c===n) burst(60);
    $$(".dot")[ci].classList.add("done");
    save();
  }
  return [c,n];
}
function go(i){
  if(i<0){ show("sc-w"); cur=-1; $("#topbar").style.display="none"; return; }
  cur=i; $("#topbar").style.display="block";
  $$(".dot").forEach((d,k)=>d.classList.toggle("cur",k===i));
  $("#barfill").style.width=(100*i/CH.length)+"%";
  if(i>=CH.length){ finish(); show("sc-end"); } else show("sc-"+i);
  window.scrollTo({top:0,behavior:"smooth"}); save();
}
function show(id){ $$(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); }

function finish(){
  let C=0,N=0,rows="";
  CH.forEach((c,i)=>{const [a,b]=check(i,false);C+=a;N+=b;rows+=`<tr><td>${c.emoji} ${c.title}</td><td>${a} / ${b}</td></tr>`});
  const p=Math.round(100*C/N), who=$("#who").value.trim();
  $("#sumt").innerHTML=rows;
  $("#pct").textContent=p+"%";
  setTimeout(()=>$("#arc").style.strokeDashoffset=503*(1-p/100),100);
  const st=p>=90?3:p>=70?2:1; $("#stars").textContent="⭐".repeat(st)+"☆".repeat(3-st);
  $("#endTitle").textContent=`כל הכבוד, ${who}! 🎉`;
  $("#endMsg").textContent=`${C} תשובות נכונות מתוך ${N}. `+(p>=90?"מושלם כמעט!":p>=70?"עבודה טובה מאוד!":"יפה! אפשר לחזור ולתקן את מה שאדום.");
  $("#barfill").style.width="100%";
  burst(p>=70?220:90);
  if(!sentOnce) send(false);
}

function answersFor(card){
  const it=card._it, out=[];
  if(it.t==="cw"||it.t==="hw") out.push([it.e,$$("input",card).map(x=>x.value).join("")]);
  else if(it.t==="mc"){const s=$(".opt.sel",card);out.push([it.e,s?it.o[+s.dataset.k]:""])}
  else if(it.t==="verb"){out.push([it.e[0],$(".r",card).value],[it.e[1],$(".z",card).value],[it.e[2],$(".g",card).value])}
  else if(it.t==="open") out.push([it.e,$("#open").value.trim()]);
  return out;
}
async function send(manual){
  const p=new URLSearchParams();
  p.append("entry."+NAME_ENTRY,$("#who").value.trim()||"אגמי");
  $$(".card").forEach(card=>{ if(!card._it) return; answersFor(card).forEach(([e,v])=>p.append("entry."+e, v||"-")); });
  p.append("pageHistory","0,1,2,3,4,5,6");
  $("#sent").textContent="שולחת לאבא...";
  try{
    await fetch(FORM,{method:"POST",mode:"no-cors",body:p});
    sentOnce=true; $("#sent").textContent="📬 התשובות נשלחו לאבא!"; $("#resend").style.display="inline-block"; $("#resend").textContent="תיקנתי, לשלוח שוב";
  }catch(e){ $("#sent").textContent="לא הצלחתי לשלוח, בדקי שיש אינטרנט ונסי שוב."; $("#resend").style.display="inline-block"; }
  save();
}

/* confetti */
const cv=$("#confetti"),cx=cv.getContext("2d");let parts=[];
function size(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio}addEventListener("resize",size);size();
function burst(n){const cols=["#ff7a59","#7c5cff","#18b6a4","#ffb400","#ff5c8a","#3a9bff"];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*cv.width,y:-20*devicePixelRatio-Math.random()*cv.height*.3,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,
    s:(6+Math.random()*8)*devicePixelRatio,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
  if(parts.length===n)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(p=>p.y<cv.height+40);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy*devicePixelRatio;p.vy+=.05;p.r+=p.vr;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);cx.restore()});
  if(parts.length)requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height)}

/* save & restore in this browser */
const KEY="agami-hebrew5";
function save(){try{const st={who:$("#who").value,cur,sentOnce,cards:$$(".card").filter(c=>c._it).map(c=>({
  b:$$(".boxes input",c).map(x=>x.value),s:($(".opt.sel",c)||{dataset:{}}).dataset.k,f:$$("input.txt,select,textarea",c).map(x=>x.value)}))};
  localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function load(){try{const st=JSON.parse(localStorage.getItem(KEY)||"null");if(!st)return;
  $("#who").value=st.who||"";sentOnce=!!st.sentOnce;
  $$(".card").filter(c=>c._it).forEach((c,i)=>{const s=st.cards[i];if(!s)return;
    $$(".boxes input",c).forEach((x,k)=>x.value=s.b[k]||"");
    if(s.s!=null){const b=$(`.opt[data-k="${s.s}"]`,c);if(b)b.classList.add("sel")}
    $$("input.txt,select,textarea",c).forEach((x,k)=>x.value=s.f[k]||"")});
  if(st.cur>=0&&st.cur<CH.length) go(st.cur);
}catch(e){}}

build(); show("sc-w"); load();
</script>
