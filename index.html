<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחברת העברית שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="welcome">
    <div class="emoji">📚</div>
    <h1 id="hello">מחברת העברית שלי</h1>
    <p>בכל יום שישי מגיע סט חדש. על כל סט שמסיימים מקבלים מדבקה לאלבום!</p>
  </div>
  <div id="latest"></div>
  <h2 style="margin:26px 0 12px">🗂️ אלבום המדבקות שלי <small id="count" style="font-size:16px;color:var(--muted)"></small></h2>
  <div class="album" id="album"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const get=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
(async()=>{
  const name=get("agami-name","");
  if(name) $("#hello").textContent=`שלום ${name}! 👋`;
  const stk=get("agami-stickers",{});
  const old=get("agami-hebrew5",null); if(old&&old.sentOnce&&!stk[1]) stk[1]="🐝";
  let idx;
  try{ idx=await (await fetch("weeks/index.json",{cache:"no-store"})).json(); }catch(e){ $("#latest").innerHTML="<p>לא הצלחתי לטעון. נסי לרענן.</p>"; return; }
  const W=idx.weeks, last=W[W.length-1];
  $("#latest").innerHTML=`<a class="hero" href="play.html?w=${last.n}" style="display:block;text-decoration:none;background:linear-gradient(135deg,#7c5cff,#ff5c8a)">
     <h2>הסט של השבוע: ${esc(last.title)}</h2><p>${esc(last.date)} · ${stk[last.n]?"סיימת! אפשר לשחק שוב ✨":"לחצי כדי להתחיל ←"}</p><div class="big">${last.sticker}</div></a>`;
  let got=0;
  $("#album").innerHTML=W.map(w=>{const has=!!stk[w.n];if(has)got++;
    return `<a class="slotw ${has?"":"no"}" href="play.html?w=${w.n}"><span class="s">${w.sticker}</span><b>שבוע ${w.n}</b><br><small>${esc(w.title)}</small>${w.n===last.n&&!has?'<br><span class="newbadge">חדש!</span>':""}</a>`}).join("");
  $("#count").textContent=`(${got} מתוך ${W.length})`;
})();
</script>
</body>
</html>
